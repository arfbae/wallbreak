name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  verify:
    name: Lint + mural prompt regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      # Fails the merge when MEDIUM_TRANSLATION drops out of the assembled
      # prompt, when a mandatory rule marker goes missing, or when the
      # medium/style validation logic regresses.
      - name: Mural prompt + medium regression tests
        run: bun run test
